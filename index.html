<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis Library - School Book & Catalog System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        teal: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                            950: '#042f2e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 118, 110, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: #0d9488;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0f766e;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased min-h-screen flex flex-col transition-colors duration-200">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Helper date utility
        const getFormattedDate = (offsetDays = 0) => {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            return d.toISOString().split('T')[0];
        };

        // --- SEED DATA ---
        const INITIAL_BOOKS = [
            {
                id: 'b1',
                title: 'The Hobbit',
                author: 'J.R.R. Tolkien',
                isbn: '9780547928227',
                genre: 'Fantasy',
                totalCopies: 4,
                availableCopies: 3,
                coverBg: 'bg-teal-700'
            },
            {
                id: 'b2',
                title: 'Charlotte\'s Web',
                author: 'E.B. White',
                isbn: '9780064400558',
                genre: 'Children',
                totalCopies: 3,
                availableCopies: 2,
                coverBg: 'bg-rose-600'
            },
            {
                id: 'b3',
                title: 'To Kill a Mockingbird',
                author: 'Harper Lee',
                isbn: '9780060935467',
                genre: 'Classic',
                totalCopies: 5,
                availableCopies: 5,
                coverBg: 'bg-slate-700'
            },
            {
                id: 'b4',
                title: 'Matilda',
                author: 'Roald Dahl',
                isbn: '9780142410370',
                genre: 'Children',
                totalCopies: 2,
                availableCopies: 1,
                coverBg: 'bg-indigo-600'
            },
            {
                id: 'b5',
                title: 'A Brief History of Time',
                author: 'Stephen Hawking',
                isbn: '9780553380163',
                genre: 'Science',
                totalCopies: 3,
                availableCopies: 3,
                coverBg: 'bg-cyan-700'
            }
        ];

        const INITIAL_STUDENTS = [
            { id: 's1', name: 'Alex Rivera', grade: '5th Grade', studentId: 'STU-1001' },
            { id: 's2', name: 'Emma Watson', grade: '6th Grade', studentId: 'STU-1002' },
            { id: 's3', name: 'Lucas Scott', grade: '4th Grade', studentId: 'STU-1003' }
        ];

        // Seed with one intentionally overdue loan to demonstrate system
        const INITIAL_LOANS = [
            {
                id: 'l1',
                bookId: 'b1',
                studentId: 's1',
                studentName: 'Alex Rivera',
                bookTitle: 'The Hobbit',
                checkoutDate: getFormattedDate(-20),
                dueDate: getFormattedDate(-6), // Overdue by 6 days
                status: 'checked_out'
            },
            {
                id: 'l2',
                bookId: 'b4',
                studentId: 's2',
                studentName: 'Emma Watson',
                bookTitle: 'Matilda',
                checkoutDate: getFormattedDate(-2),
                dueDate: getFormattedDate(12),
                status: 'checked_out'
            }
        ];

        function App() {
            // Authentication & Session State
            const [currentUser, setCurrentUser] = useState(null); // null | { role: 'admin' } | { role: 'student', student: {...} }
            const [adminPin, setAdminPin] = useState('1234');
            const [isDarkMode, setIsDarkMode] = useState(false);

            // App Data State
            const [books, setBooks] = useState(INITIAL_BOOKS);
            const [students, setStudents] = useState(INITIAL_STUDENTS);
            const [loans, setLoans] = useState(INITIAL_LOANS);

            // Library Policy Settings
            const [settings, setSettings] = useState({
                loanDays: 14,
                maxBooksPerStudent: 2,
                geminiApiKey: ''
            });

            // Navigation Tabs
            const [adminTab, setAdminTab] = useState('catalog'); // 'catalog' | 'returns' | 'students' | 'settings'
            const [studentTab, setStudentTab] = useState('shelf'); // 'shelf' | 'browse' | 'my-loans'
            const [isAddBookModalOpen, setIsAddBookModalOpen] = useState(false);
            const [toast, setToast] = useState(null);

            // Toggle Dark Mode Class on Root HTML element
            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            // Helper to check if a loan is overdue
            const isLoanOverdue = (dueDateStr) => {
                const todayStr = getFormattedDate(0);
                return dueDateStr < todayStr;
            };

            // Helper to check if a specific student has ANY overdue books
            const hasStudentOverdueBooks = (studentId) => {
                const todayStr = getFormattedDate(0);
                return loans.some(l => l.studentId === studentId && l.status === 'checked_out' && l.dueDate < todayStr);
            };

            // Book checkout logic with overdue & max limit safeguards
            const handleCheckoutBook = (book) => {
                if (!currentUser || currentUser.role !== 'student') return;

                const student = currentUser.student;
                const activeStudentLoans = loans.filter(l => l.studentId === student.id && l.status === 'checked_out');

                // Safeguard 1: Overdue Check
                if (hasStudentOverdueBooks(student.id)) {
                    showToast('Checkout blocked: You have an overdue book! Please return it to the librarian first.', 'error');
                    return;
                }

                // Safeguard 2: Max Limit Check
                if (activeStudentLoans.length >= settings.maxBooksPerStudent) {
                    showToast(`Checkout blocked: You have reached the maximum limit of ${settings.maxBooksPerStudent} books.`, 'warning');
                    return;
                }

                // Safeguard 3: Availability Check
                if (book.availableCopies <= 0) {
                    showToast('No copies currently available for checkout.', 'error');
                    return;
                }

                // Safeguard 4: Duplicate Checkout Check
                const alreadyHasBook = activeStudentLoans.some(l => l.bookId === book.id);
                if (alreadyHasBook) {
                    showToast(`You already have "${book.title}" checked out.`, 'warning');
                    return;
                }

                // Perform Checkout
                const today = getFormattedDate(0);
                const dueDate = getFormattedDate(settings.loanDays);

                const newLoan = {
                    id: 'l_' + Date.now(),
                    bookId: book.id,
                    studentId: student.id,
                    studentName: student.name,
                    bookTitle: book.title,
                    checkoutDate: today,
                    dueDate: dueDate,
                    status: 'checked_out'
                };

                setLoans([newLoan, ...loans]);
                setBooks(books.map(b => b.id === book.id ? { ...b, availableCopies: b.availableCopies - 1 } : b));

                showToast(`Successfully checked out "${book.title}"! Due date: ${dueDate}.`);
            };

            // Return book (ADMIN ONLY)
            const handleReturnBook = (loanId) => {
                const targetLoan = loans.find(l => l.id === loanId);
                if (!targetLoan || targetLoan.status === 'returned') return;

                const today = getFormattedDate(0);

                setLoans(loans.map(l => l.id === loanId ? { ...l, status: 'returned', returnDate: today } : l));
                setBooks(books.map(b => b.id === targetLoan.bookId ? { ...b, availableCopies: Math.min(b.totalCopies, b.availableCopies + 1) } : b));

                showToast(`Book returned and logged into inventory for ${targetLoan.studentName}.`);
            };

            // Add new student
            const handleAddStudent = (newStudentData) => {
                const newStudent = {
                    id: 's_' + Date.now(),
                    ...newStudentData
                };
                setStudents([...students, newStudent]);
                showToast(`Student account created for ${newStudent.name} (${newStudent.studentId}).`);
            };

            // Add new book (Defaults totalCopies to 1 and genre to None if unselected)
            const handleAddBook = (newBookData) => {
                const colors = ['bg-teal-600', 'bg-emerald-600', 'bg-teal-700', 'bg-rose-600', 'bg-purple-700', 'bg-teal-800', 'bg-blue-700'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];

                const copies = parseInt(newBookData.totalCopies, 10) || 1;

                const newBook = {
                    id: 'b_' + Date.now(),
                    ...newBookData,
                    genre: newBookData.genre || 'None',
                    totalCopies: copies,
                    availableCopies: copies,
                    coverBg: randomColor
                };

                setBooks([newBook, ...books]);
                setIsAddBookModalOpen(false);
                showToast(`"${newBook.title}" added to the library catalog!`);
            };

            // Delete book handler (ADMIN ONLY)
            const handleDeleteBook = (bookId) => {
                const activeLoansForBook = loans.filter(l => l.bookId === bookId && l.status === 'checked_out');
                if (activeLoansForBook.length > 0) {
                    showToast('Cannot delete book: One or more copies are currently checked out.', 'error');
                    return;
                }

                const bookToDelete = books.find(b => b.id === bookId);
                setBooks(books.filter(b => b.id !== bookId));
                showToast(`"${bookToDelete ? bookToDelete.title : 'Book'}" deleted from catalog.`);
            };

            // Export Backup Data
            const handleExportData = () => {
                const backupPayload = {
                    appName: 'Genesis Library Backup',
                    exportedAt: new Date().toISOString(),
                    books,
                    students,
                    loans,
                    settings
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `genesis_library_backup_${getFormattedDate(0)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast('System data backup downloaded successfully!');
            };

            // Import Backup Data
            const handleImportData = (file) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.books && imported.students && imported.loans) {
                            setBooks(imported.books);
                            setStudents(imported.students);
                            setLoans(imported.loans);
                            if (imported.settings) setSettings(imported.settings);
                            showToast('Library database successfully restored from backup file!');
                        } else {
                            showToast('Invalid backup file format.', 'error');
                        }
                    } catch (err) {
                        showToast('Failed to parse backup JSON file.', 'error');
                    }
                };
                reader.readAsText(file);
            };

            // Login Handler
            if (!currentUser) {
                return (
                    <LoginScreen
                        students={students}
                        adminPin={adminPin}
                        onLoginSuccess={(userSession) => setCurrentUser(userSession)}
                        isDarkMode={isDarkMode}
                        setIsDarkMode={setIsDarkMode}
                    />
                );
            }

            return (
                <div className="flex flex-col min-h-screen transition-colors duration-200">
                    {/* TOP NAVIGATION HEADER */}
                    <header className="bg-teal-900 text-white shadow-lg sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            {/* Logo */}
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-teal-400 text-teal-950 flex items-center justify-center font-bold text-xl shadow-md">
                                    <i className="fa-solid fa-book-bookmark"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight tracking-wide">Genesis Library</h1>
                                    <p className="text-xs text-teal-300 font-medium">Digital Catalog & Desktop Portal</p>
                                </div>
                            </div>

                            {/* Header Actions */}
                            <div className="flex items-center space-x-3">
                                {/* Dark Mode Toggle */}
                                <button
                                    onClick={() => setIsDarkMode(!isDarkMode)}
                                    className="p-2 rounded-xl bg-teal-800 hover:bg-teal-700 text-teal-200 hover:text-white transition-all text-xs flex items-center gap-1.5"
                                    title="Toggle Light/Dark Theme"
                                >
                                    <i className={`fa-solid ${isDarkMode ? 'fa-sun text-amber-300' : 'fa-moon'}`}></i>
                                    <span className="hidden sm:inline font-semibold">{isDarkMode ? 'Light' : 'Dark'}</span>
                                </button>

                                {/* Current User Profile Badge */}
                                <div className="bg-teal-800/90 px-3 py-1.5 rounded-xl border border-teal-700/80 flex items-center gap-2 text-xs">
                                    <i className={`fa-solid ${currentUser.role === 'admin' ? 'fa-user-shield text-teal-300' : 'fa-graduation-cap text-teal-300'}`}></i>
                                    <span className="font-bold">
                                        {currentUser.role === 'admin' ? 'Librarian Desk' : currentUser.student.name}
                                    </span>
                                </div>

                                {/* Logout Button */}
                                <button
                                    onClick={() => setCurrentUser(null)}
                                    className="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs shadow-sm transition-all flex items-center gap-1"
                                >
                                    <i className="fa-solid fa-right-from-bracket"></i>
                                    <span className="hidden sm:inline">Logout</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* ROLE BANNER */}
                    <div className={`px-4 py-2 text-xs font-semibold flex items-center justify-between border-b ${
                        currentUser.role === 'admin'
                            ? 'bg-teal-500/10 dark:bg-teal-950/40 text-teal-900 dark:text-teal-200 border-teal-200 dark:border-teal-800'
                            : 'bg-emerald-500/10 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 border-emerald-200 dark:border-emerald-800'
                    }`}>
                        <div className="max-w-7xl mx-auto w-full flex items-center justify-between">
                            <span className="flex items-center gap-2">
                                <i className={`fa-solid ${currentUser.role === 'admin' ? 'fa-lock-open text-teal-600 dark:text-teal-400' : 'fa-laptop-code text-emerald-600 dark:text-emerald-400'}`}></i>
                                {currentUser.role === 'admin' 
                                    ? 'ADMINISTRATOR MODE — Manage books, settings, student roster & returns.' 
                                    : `DIGITAL LIBRARY DESKTOP — ${currentUser.student.name} (${currentUser.student.grade}). Max ${settings.maxBooksPerStudent} books allowed.`
                                }
                            </span>
                            {currentUser.role === 'student' && hasStudentOverdueBooks(currentUser.student.id) && (
                                <span className="text-rose-600 dark:text-rose-400 font-bold animate-pulse flex items-center gap-1">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                    YOU HAVE AN OVERDUE BOOK
                                </span>
                            )}
                        </div>
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {currentUser.role === 'admin' ? (
                            <AdminDashboard
                                books={books}
                                students={students}
                                loans={loans}
                                settings={settings}
                                adminPin={adminPin}
                                setSettings={setSettings}
                                setAdminPin={setAdminPin}
                                activeTab={adminTab}
                                setActiveTab={setAdminTab}
                                onOpenAddBookModal={() => setIsAddBookModalOpen(true)}
                                onReturnBook={handleReturnBook}
                                onAddStudent={handleAddStudent}
                                onDeleteBook={handleDeleteBook}
                                onExportData={handleExportData}
                                onImportData={handleImportData}
                                isLoanOverdue={isLoanOverdue}
                                showToast={showToast}
                            />
                        ) : (
                            <StudentDigitalLibrary
                                books={books}
                                loans={loans}
                                currentStudent={currentUser.student}
                                settings={settings}
                                activeTab={studentTab}
                                setActiveTab={setStudentTab}
                                onCheckoutBook={handleCheckoutBook}
                                isLoanOverdue={isLoanOverdue}
                                hasOverdue={hasStudentOverdueBooks(currentUser.student.id)}
                            />
                        )}
                    </main>

                    {/* ADD BOOK MODAL WITH AI CAMERA SCANNER */}
                    {isAddBookModalOpen && (
                        <AddBookModal
                            onClose={() => setIsAddBookModalOpen(false)}
                            onSaveBook={handleAddBook}
                            showToast={showToast}
                            apiKey={settings.geminiApiKey}
                            onSaveApiKey={(key) => {
                                setSettings({ ...settings, geminiApiKey: key });
                                showToast('Gemini API Key saved successfully!');
                            }}
                        />
                    )}

                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border text-sm font-semibold animate-bounce ${
                            toast.type === 'error' ? 'bg-rose-900 text-rose-100 border-rose-700' :
                            toast.type === 'warning' ? 'bg-amber-900 text-amber-100 border-amber-700' :
                            'bg-teal-900 text-white border-teal-700'
                        }`}>
                            <i className={`fa-solid ${
                                toast.type === 'error' ? 'fa-circle-xmark text-rose-400' :
                                toast.type === 'warning' ? 'fa-triangle-exclamation text-amber-400' :
                                'fa-circle-check text-teal-300'
                            } text-lg`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-slate-100 dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 py-4 text-center text-xs text-slate-500 dark:text-slate-400 mt-auto">
                        <p>© 2026 Genesis Library • Powered by Gemini AI Vision</p>
                    </footer>
                </div>
            );
        }

        // =========================================================================
        // LOGIN SCREEN WITH ADMIN PIN (DEFAULT: 1234) & STUDENT SELECTOR
        // =========================================================================
        function LoginScreen({ students, adminPin, onLoginSuccess, isDarkMode, setIsDarkMode }) {
            const [loginMode, setLoginMode] = useState('student'); // 'student' | 'admin'
            const [pinInput, setPinInput] = useState('');
            const [selectedStudentId, setSelectedStudentId] = useState(students[0]?.id || '');
            const [error, setError] = useState('');

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (pinInput === adminPin) {
                    onLoginSuccess({ role: 'admin' });
                } else {
                    setError('Incorrect 4-Digit Admin PIN Code.');
                }
            };

            const handleStudentLogin = (e) => {
                e.preventDefault();
                const student = students.find(s => s.id === selectedStudentId);
                if (student) {
                    onLoginSuccess({ role: 'student', student });
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-teal-900 via-teal-950 to-slate-950 text-white flex flex-col justify-center items-center p-4 relative">
                    {/* Theme Switcher Top Right */}
                    <button
                        onClick={() => setIsDarkMode(!isDarkMode)}
                        className="absolute top-5 right-5 p-2.5 rounded-2xl bg-teal-900/60 border border-teal-700/50 text-teal-200 text-xs font-bold flex items-center gap-2 hover:bg-teal-800 transition-all"
                    >
                        <i className={`fa-solid ${isDarkMode ? 'fa-sun text-amber-300' : 'fa-moon'}`}></i>
                        <span>{isDarkMode ? 'Light Mode' : 'Dark Mode'}</span>
                    </button>

                    <div className="w-full max-w-md bg-slate-900/90 border border-teal-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-md">
                        <div className="text-center mb-6">
                            <div className="w-16 h-16 bg-gradient-to-tr from-teal-400 to-teal-200 text-teal-950 rounded-2xl flex items-center justify-center mx-auto text-3xl font-extrabold shadow-lg mb-3">
                                <i className="fa-solid fa-book-bookmark"></i>
                            </div>
                            <h2 className="text-2xl font-black text-white">Genesis Library</h2>
                            <p className="text-xs text-teal-300/80 mt-1">Select account mode to enter the portal</p>
                        </div>

                        {/* Mode Selector Tabs */}
                        <div className="bg-slate-950/80 p-1.5 rounded-2xl flex border border-teal-900 mb-6">
                            <button
                                onClick={() => { setLoginMode('student'); setError(''); }}
                                className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 ${
                                    loginMode === 'student' ? 'bg-teal-500 text-teal-950 shadow-md' : 'text-slate-400 hover:text-white'
                                }`}
                            >
                                <i className="fa-solid fa-graduation-cap"></i>
                                Student Access
                            </button>
                            <button
                                onClick={() => { setLoginMode('admin'); setError(''); }}
                                className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 ${
                                    loginMode === 'admin' ? 'bg-teal-500 text-teal-950 shadow-md' : 'text-slate-400 hover:text-white'
                                }`}
                            >
                                <i className="fa-solid fa-user-shield"></i>
                                Admin Desk
                            </button>
                        </div>

                        {error && (
                            <div className="mb-4 p-3 rounded-xl bg-rose-950/80 border border-rose-700 text-rose-200 text-xs font-semibold flex items-center gap-2">
                                <i className="fa-solid fa-triangle-exclamation text-rose-400 text-sm"></i>
                                <span>{error}</span>
                            </div>
                        )}

                        {loginMode === 'student' ? (
                            <form onSubmit={handleStudentLogin} className="space-y-4 text-xs">
                                <div>
                                    <label className="block text-slate-300 font-semibold mb-2">Select Student Profile</label>
                                    <select
                                        value={selectedStudentId}
                                        onChange={(e) => setSelectedStudentId(e.target.value)}
                                        className="w-full px-4 py-3 bg-slate-950 border border-teal-800/80 rounded-xl text-white font-semibold focus:outline-none focus:ring-2 focus:ring-teal-400"
                                    >
                                        {students.map(s => (
                                            <option key={s.id} value={s.id}>
                                                {s.name} — {s.grade} ({s.studentId})
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <button
                                    type="submit"
                                    className="w-full py-3 bg-teal-500 hover:bg-teal-400 text-teal-950 font-extrabold text-sm rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 active:scale-95"
                                >
                                    <span>Enter Digital Library</span>
                                    <i className="fa-solid fa-arrow-right"></i>
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={handleAdminLogin} className="space-y-4 text-xs">
                                <div>

        // --- ADMIN: BOOK CATALOG VIEW ---
        function AdminBookCatalog({ books, onDeleteBook }) {
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedGenre, setSelectedGenre] = useState('All');
            const [confirmDeleteId, setConfirmDeleteId] = useState(null);

            const genres = ['All', ...new Set(books.map(b => b.genre))];

            const filteredBooks = books.filter(b => {
                const matchesSearch = b.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      b.author.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      b.isbn.includes(searchQuery);
                const matchesGenre = selectedGenre === 'All' || b.genre === selectedGenre;
                return matchesSearch && matchesGenre;
            });

            return (
                <div className="space-y-4">
                    {/* Filters */}
                    <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row gap-3 items-center justify-between">
                        <div className="relative w-full md:w-80">
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                            <input
                                type="text"
                                placeholder="Search by Title, Author, or ISBN..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full pl-10 pr-4 py-2 text-xs border border-slate-200 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"

                            <span className="text-xs text-slate-400 font-medium whitespace-nowrap">Genre:</span>
                            {genres.map(g => (
                                <button
                                    key={g}
                                    onClick={() => setSelectedGenre(g)}
                                    className={`px-3 py-1 rounded-lg text-xs font-medium whitespace-nowrap transition-all ${
                                        selectedGenre === g ? 'bg-teal-600 text-white font-bold' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
                                    }`}
                                >
                                    {g}
                                </button>

                    {/* Book Cards Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

                                <p className="font-semibold text-sm">No books found matching your search.</p>

                                <div key={book.id} className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 shadow-sm hover:shadow-md transition-shadow flex gap-4">
                                    {/* Cover Visual */}
                                    <div className={`w-20 h-28 ${book.coverBg || 'bg-teal-700'} rounded-xl shadow-md flex-shrink-0 flex flex-col justify-between p-2 text-white relative overflow-hidden`}>
                                        <div className="text-[9px] font-bold opacity-80 uppercase tracking-wider">{book.genre}</div>
                                        <div>
                                            <p className="text-xs font-bold leading-tight line-clamp-2">{book.title}</p>
                                            <p className="text-[9px] opacity-80 mt-0.5 line-clamp-1">{book.author}</p>
                                        </div>
                                        <div className="absolute right-1 bottom-1 text-slate-900/10 text-3xl font-black">
                                            <i className="fa-solid fa-book"></i>
                                        </div>
                                    </div>

                                    {/* Info */}
                                    <div className="flex-1 flex flex-col justify-between">
                                        <div>
                                            <div className="flex items-start justify-between gap-1">
                                                <h4 className="font-bold text-sm text-slate-900 dark:text-white line-clamp-1">{book.title}</h4>
                                                <span className="text-[10px] font-mono px-1.5 py-0.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded">
                                                    ISBN: {book.isbn || 'N/A'}

                                            </div>
                                            <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">By {book.author}</p>
                                        </div>

                                        <div className="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between text-xs">
                                            <span className="text-slate-500 dark:text-slate-400">

                                                        </button>
                                                        <button

                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        // --- ADMIN: RETURN DESK & OVERDUE SYSTEM ---
        function AdminReturnDesk({ loans, onReturnBook, isLoanOverdue }) {

                            <input
                                type="text"
                                placeholder="Filter active loans..."
                                value={filterQuery}
                                onChange={(e) => setFilterQuery(e.target.value)}
                                className="px-3 py-1.5 text-xs border border-slate-200 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
                            />
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                                <thead className="bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 font-semibold uppercase border-b border-slate-200 dark:border-slate-700">
                                    <tr>
                                        <th className="p-3">Book Title</th>
                                        <th className="p-3">Borrowed By</th>
                                        <th className="p-3">Checkout Date</th>
                                        <th className="p-3">Due Date</th>
                                        <th className="p-3">Status</th>
                                        <th className="p-3 text-right">Admin Action</th>

                                                    <td className="p-3">
                                                        <span className="font-medium text-slate-800 dark:text-slate-200">{loan.studentName}</span>

        // =========================================================================
        // ADD BOOK MODAL WITH AI CAMERA SCANNER LOGIC
        // =========================================================================
        function AddBookModal({ onClose, onSaveBook, showToast, apiKey, onSaveApiKey }) {
            const [mode, setMode] = useState('camera'); // 'camera' | 'manual'
            const [isScanning, setIsScanning] = useState(false);
            const [cameraError, setCameraError] = useState(null);
            const [showApiKeyInput, setShowApiKeyInput] = useState(false);
            const [tempApiKey, setTempApiKey] = useState(apiKey || '');

            // Form data (Defaults: copies = 1, genre = None)
            const [title, setTitle] = useState('');
            const [author, setAuthor] = useState('');
            const [isbn, setIsbn] = useState('');
            const [genre, setGenre] = useState('None');
            const [totalCopies, setTotalCopies] = useState(1);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const streamRef = useRef(null);

            // Start camera stream when in camera mode
            useEffect(() => {
                if (mode === 'camera') {
                    startCamera();
                } else {
                    stopCamera();
                }
                return () => stopCamera();
            }, [mode]);

            const startCamera = async () => {
                setCameraError(null);
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                    streamRef.current = stream;
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                } catch (err) {
                    console.error('Camera access error:', err);
                    setCameraError('Unable to access camera. Please check permissions or switch to manual input.');
                }
            };

            const stopCamera = () => {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                    streamRef.current = null;
                }
            };

            // CAPTURE FRAME & CALL GEMINI AI VISION API
            const handleScanWithGemini = async () => {
                if (!videoRef.current || isScanning) return;

                const activeKey = apiKey || tempApiKey;
                if (!activeKey) {
                    showToast('Please configure a Google Gemini API key first.', 'error');
                    setShowApiKeyInput(true);
                    return;
                }

                setIsScanning(true);

                try {
                    // Capture image from video stream onto canvas
                    const video = videoRef.current;
                    const canvas = canvasRef.current;
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // Convert frame to base64
                    const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const base64Data = imageDataUrl.split(',')[1];

                    // 3. Construct Gemini API Request using gemini-3-flash-preview with fallback support
                    const systemPrompt = "You are a specialized school library assistant cataloging books from camera photos.";
                    const userPrompt = "Analyze this image of a book cover, title page, or barcode label. Extract the book Title, Author, ISBN or Barcode number (if visible), and primary Genre. Format strictly as JSON.";

                    const payload = {
                        contents: [{
                            role: 'user',
                            parts: [
                                { text: userPrompt },
                                {
                                    inlineData: {
                                        mimeType: 'image/jpeg',
                                        data: base64Data
                                    }
                                }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: 'application/json',
                            responseSchema: {
                                type: 'OBJECT',
                                properties: {
                                    title: { type: 'STRING' },
                                    author: { type: 'STRING' },
                                    isbn: { type: 'STRING' },
                                    genre: { type: 'STRING' }
                                },
                                required: ['title', 'author', 'genre']
                            }
                        },
                        systemInstruction: {
                            parts: [{ text: systemPrompt }]
                        }
                    };

                    // Fallback models in case of transient 503 service issues on primary model
                    const candidateModels = ['gemini-2.5-flash', 'gemini-2.5-pro', 'gemini-3-flash-preview'];
                    let response = null;
                    let lastError = null;

                    for (const modelName of candidateModels) {
                        try {
                            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeKey}`;
                            const res = await fetch(apiUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            if (res.ok) {
                                response = res;
                                break;
                            } else if (res.status === 503 || res.status === 429) {
                                console.warn(`Model ${modelName} returned status ${res.status}. Trying fallback...`);
                                lastError = new Error(`Gemini API returned status ${res.status} (${res.statusText})`);
                                // Brief pause before retrying next candidate
                                await new Promise(r => setTimeout(r, 800));
                            } else {
                                lastError = new Error(`Gemini API returned code ${res.status}`);
                            }
                        } catch (e) {
                            lastError = e;
                        }
                    }

                    if (!response) {
                        throw lastError || new Error('All model endpoints failed to respond.');
                    }

                    const result = await response.json();
                    const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (jsonText) {
                        const parsed = JSON.parse(jsonText);
                        setTitle(parsed.title || '');
                        setAuthor(parsed.author || '');
                        setIsbn(parsed.isbn || '');
                        setGenre(parsed.genre || 'None');

                        showToast(`Gemini extracted book details for "${parsed.title || 'Book'}"!`);
                        setMode('manual'); // Switch to form to review & save
                    } else {
                        throw new Error('No structured response from Gemini API');
                    }
                } catch (err) {
                    console.error('Gemini Scan Error:', err);
                    showToast('AI Service temporarily busy (503). Please try scanning again in a moment.', 'error');
                } finally {
                    setIsScanning(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title || !author) {
                    showToast('Title and Author are required fields.', 'error');
                    return;
                }
                onSaveBook({ title, author, isbn, genre, totalCopies });
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-800 w-full max-w-xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        {/* Header */}
                        <div className="p-5 bg-teal-900 text-white flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <i className="fa-solid fa-camera text-teal-300 text-xl"></i>
                                <div>
                                    <h3 className="font-bold text-sm">Add New Book to Inventory</h3>
                                    <p className="text-xs text-teal-300">Scan using AI Camera or Manual Entry</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-teal-200 hover:text-white p-1">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {/* Sub-navigation */}
                        <div className="bg-slate-100 dark:bg-slate-900 p-1.5 flex border-b border-slate-200 dark:border-slate-700">
                            <button
                                onClick={() => setMode('camera')}
                                className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 ${
                                    mode === 'camera' ? 'bg-white dark:bg-slate-800 text-teal-700 dark:text-teal-300 shadow-sm' : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'
                                }`}
                            >
                                <i className="fa-solid fa-camera"></i>
                                Camera AI Scanner
                            </button>
                            <button
                                onClick={() => setMode('manual')}
                                className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 ${
                                    mode === 'manual' ? 'bg-white dark:bg-slate-800 text-teal-700 dark:text-teal-300 shadow-sm' : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'
                                }`}
                            >
                                <i className="fa-solid fa-keyboard"></i>
                                Manual Form Entry
                            </button>
                        </div>

                        {/* Modal Body */}
                        <div className="p-6 overflow-y-auto flex-1">
                            {mode === 'camera' ? (
                                <div className="space-y-4">
                                    {/* Gemini API Key inline banner */}
                                    <div className="bg-slate-100 dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                        <div className="flex items-center gap-2">
                                            <i className="fa-solid fa-key text-teal-500"></i>
                                            <span className="font-semibold text-slate-700 dark:text-slate-300">
                                                API Key: {apiKey || tempApiKey ? '••••••••' + (apiKey || tempApiKey).slice(-4) : 'Not configured'}
                                            </span>
                                        </div>
                                        <button
                                            onClick={() => setShowApiKeyInput(!showApiKeyInput)}
                                            className="text-teal-600 dark:text-teal-400 hover:underline font-bold text-left sm:text-right"
                                        >
                                            {showApiKeyInput ? 'Hide Key Field' : (apiKey || tempApiKey ? 'Change Key' : '+ Add Gemini Key')}
                                        </button>
                                    </div>

                                    {showApiKeyInput && (
                                        <div className="bg-teal-50 dark:bg-teal-950/50 p-3 rounded-2xl border border-teal-200 dark:border-teal-800 text-xs space-y-2">
                                            <label className="block font-bold text-teal-900 dark:text-teal-200">
                                                Enter Google Gemini API Key
                                            </label>
                                            <div className="flex gap-2">
                                                <input
                                                    type="password"
                                                    placeholder="AIzaSy..."
                                                    value={tempApiKey}
                                                    onChange={(e) => setTempApiKey(e.target.value)}
                                                    className="flex-1 px-3 py-1.5 border border-teal-300 dark:border-teal-700 rounded-xl dark:bg-slate-900 text-slate-900 dark:text-white font-mono text-xs"
                                                />
                                                <button
                                                    onClick={() => {
                                                        onSaveApiKey(tempApiKey);
                                                        setShowApiKeyInput(false);
                                                    }}
                                                    className="px-3 py-1.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl"
                                                >
                                                    Save Key
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    <div className="bg-slate-900 rounded-2xl overflow-hidden aspect-video relative flex items-center justify-center border-2 border-dashed border-slate-700">
                                        <video
                                            ref={videoRef}
                                            autoPlay
                                            playsInline
                                            muted
                                            className="w-full h-full object-cover"
                                        />
                                        <canvas ref={canvasRef} className="hidden" />

                                        {/* Camera Scanner Viewfinder Target Overlay */}
                                        <div className="absolute inset-0 border-[3px] border-teal-400/40 m-8 rounded-xl pointer-events-none flex items-center justify-center">
                                            <div className="text-center bg-slate-950/70 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-teal-400/30 text-[11px] text-teal-300 font-semibold">
                                                Hold book title or barcode within box
                                            </div>
                                        </div>

                                        {/* Loading overlay */}
                                        {isScanning && (
                                            <div className="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center text-white space-y-3 z-10">
                                                <div className="w-12 h-12 border-4 border-teal-400 border-t-transparent rounded-full animate-spin"></div>
                                                <p className="font-bold text-sm">Gemini AI is analyzing book cover...</p>
                                                <p className="text-xs text-slate-400">Extracting Title, Author, ISBN & Genre</p>
                                            </div>
                                        )}

                                        {cameraError && (
                                            <div className="absolute inset-0 bg-slate-900 p-6 text-center flex flex-col items-center justify-center text-rose-300 text-xs">
                                                <i className="fa-solid fa-video-slash text-3xl mb-2 text-rose-400"></i>
                                                <p>{cameraError}</p>
                                                <button
                                                    onClick={() => setMode('manual')}
                                                    className="mt-3 px-4 py-2 bg-slate-800 text-white rounded-xl font-bold"
                                                >
                                                    Switch to Manual Entry
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex items-center justify-between gap-3">
                                        <p className="text-xs text-slate-500 dark:text-slate-400">
                                            Point camera at any book cover or spine. Gemini Vision auto-fills details.
                                        </p>
                                        <button
                                            onClick={handleScanWithGemini}
                                            disabled={isScanning || cameraError}
                                            className="px-5 py-2.5 bg-teal-500 hover:bg-teal-400 active:scale-95 text-teal-950 font-black text-xs rounded-xl shadow-md transition-all flex items-center gap-2 whitespace-nowrap"
                                        >
                                            <i className="fa-solid fa-bolt"></i>
                                            Scan Title / Barcode
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div className="sm:col-span-2">
                                            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Book Title *</label>
                                            <input
                                                type="text"
                                                required
                                                placeholder="Title of the book..."
                                                value={title}
                                                onChange={(e) => setTitle(e.target.value)}
                                                className="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Author *</label>
                                            <input
                                                type="text"
                                                required
                                                placeholder="Author name..."
                                                value={author}
                                                onChange={(e) => setAuthor(e.target.value)}
                                                className="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">ISBN / Barcode</label>
                                            <input
                                                type="text"
                                                placeholder="e.g. 9780547928227"
                                                value={isbn}
                                                onChange={(e) => setIsbn(e.target.value)}
                                                className="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl font-mono focus:outline-none focus:ring-2 focus:ring-teal-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Genre</label>
                                            <input
                                                type="text"
                                                placeholder="e.g. Fantasy, Science..."
                                                value={genre}
                                                onChange={(e) => setGenre(e.target.value)}
                                                className="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Total Copies</label>
                                            <input
                                                type="number"
                                                min="1"
                                                value={totalCopies}
                                                onChange={(e) => setTotalCopies(e.target.value)}
                                                className="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 font-mono"
                                            />
                                        </div>
                                    </div>

                                    <div className="pt-4 flex justify-end gap-3 border-t border-slate-200 dark:border-slate-700">
                                        <button
                                            type="button"
                                            onClick={onClose}
                                            className="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-xs"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-md text-xs transition-all"
                                        >
                                            Save Book to Catalog
                                        </button>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- STUDENT: DIGITAL READER MODAL ---
        function DigitalReaderModal({ book, myLoans, onClose, onCheckout, hasOverdue }) {
            const isBorrowed = myLoans.some(l => l.bookId === book.id);

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-800 w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
                        <div className="p-5 bg-teal-900 text-white flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <i className="fa-solid fa-laptop-file text-teal-300 text-xl"></i>
                                <div>
                                    <h3 className="font-bold text-sm">{book.title}</h3>
                                    <p className="text-xs text-teal-300">Digital Terminal</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-teal-200 hover:text-white p-1">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <div className="p-6 overflow-y-auto space-y-4 text-xs text-slate-700 dark:text-slate-200">
                            <div className="flex flex-col sm:flex-row gap-4 items-center">
                                <div className={`w-28 h-40 ${book.coverBg || 'bg-teal-700'} rounded-2xl shadow-md p-3 text-white flex-shrink-0 flex flex-col justify-between`}>
                                    <span className="text-[9px] uppercase font-bold opacity-80">{book.genre}</span>
                                    <div>
                                        <p className="text-xs font-bold">{book.title}</p>
                                        <p className="text-[10px] opacity-80">{book.author}</p>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <h4 className="text-lg font-bold text-slate-900 dark:text-white">{book.title}</h4>
                                    <p className="font-semibold text-teal-600 dark:text-teal-400">Written by {book.author}</p>
                                    <p className="text-slate-500 dark:text-slate-400">Genre: <strong className="text-slate-800 dark:text-slate-200">{book.genre}</strong></p>
                                    <p className="text-slate-500 dark:text-slate-400">ISBN: <strong className="font-mono text-slate-800 dark:text-slate-200">{book.isbn || 'N/A'}</strong></p>
                                </div>
                            </div>
                        </div>

                        <div className="p-4 bg-slate-50 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between">
                            <span className="text-xs text-slate-500">
                                Availability: <strong>{book.availableCopies}</strong> copies in stock
                            </span>

                            {isBorrowed ? (
                                <span className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl flex items-center gap-2">
                                    <i className="fa-solid fa-circle-check"></i> Checked Out & In Your Library
                                </span>
                            ) : (
                                <button
                                    onClick={() => { onCheckout(book); onClose(); }}
                                    disabled={book.availableCopies <= 0 || hasOverdue}
                                    className={`px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${
                                        book.availableCopies > 0 && !hasOverdue
                                            ? 'bg-teal-600 hover:bg-teal-700 text-white shadow-md active:scale-95'
                                            : 'bg-slate-300 dark:bg-slate-700 text-slate-500 cursor-not-allowed'
                                    }`}
                                >
                                    <i className="fa-solid fa-cart-plus"></i>
                                    {hasOverdue ? 'Blocked (Overdue Book)' : 'Check Out Digital Copy'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Render React Root
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
